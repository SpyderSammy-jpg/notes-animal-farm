
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Farm Notes: Your Copy</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 460px;
    text-align: center;
  }

  h1 {
    font-size: clamp(25px, 5vw, 36px);
    line-height: 1.2;
    margin: 0 0 12px;
    font-weight: 900;
  }

  .description {
    color: #aaa;
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 28px;
  }

  .red-button {
    display: block;
    width: 100%;
    padding: 17px 20px;
    border: 0;
    border-radius: 10px;
    background: #e52222;
    color: white;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    transition: background .2s, transform .2s;
  }

  .red-button:hover {
    background: #ff3636;
    transform: translateY(-2px);
  }

  .red-button:active {
    transform: scale(.98);
  }

  .screen {
    display: none;
  }

  .screen.active {
    display: block;
  }

  .name-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 22px;
  }

  .name-button {
    background: #171717;
    color: white;
    border: 1px solid #444;
    border-radius: 9px;
    padding: 15px 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
  }

  .name-button:hover {
    background: #351313;
    border-color: #e52222;
  }

  .welcome {
    color: #ff3b3b;
    font-size: clamp(26px, 6vw, 38px);
    font-weight: 900;
    margin: 20px 0;
    overflow-wrap: anywhere;
  }

  .small-text {
    color: #888;
    font-size: 12px;
    line-height: 1.6;
    margin-top: 20px;
  }

  .change-button {
    margin-top: 15px;
    background: transparent;
    border: 1px solid #444;
    border-radius: 8px;
    color: #aaa;
    padding: 9px 13px;
    cursor: pointer;
    font-size: 12px;
  }

  .change-button:hover {
    color: white;
    border-color: #e52222;
  }

  [hidden] {
    display: none !important;
  }
</style>
</head>

<body>
<div class="container">

  <!-- Main screen -->
  <section id="homeScreen" class="screen active">
    <h1>Animal Farm Notes</h1>
    <p class="description">
      Your personal copy of the Animal Farm notes.
    </p>

    <button class="red-button" id="openButton">
      Your Copy
    </button>

    <p class="small-text">
      Press the button to open your notes.
    </p>
  </section>

  <!-- First-time name selection -->
  <section id="pickerScreen" class="screen">
    <h1>Choose Your Copy</h1>
    <p class="description">
      Select your name to open your assigned notes.
      Your choice will be remembered on this browser.
    </p>

    <div class="name-list" id="nameList"></div>

    <button class="change-button" id="backButton">
      Go Back
    </button>
  </section>

  <!-- Welcome screen -->
  <section id="welcomeScreen" class="screen">
    <div class="welcome" id="welcomeMessage">Welcome!</div>
    <p class="description">
      Opening your personal Animal Farm notes...
    </p>
  </section>

</div>

<script>
(() => {
  "use strict";

  /*
    This is a browser-local name preference, not email verification.
    To verify school email addresses securely, use an authenticated
    service or a backend instead of trusting a name picker.
  */

  const STORAGE_KEY = "animalFarmNotesChosenCopy_v1";

  const students = {
    "Tanuj": {
      email: "2084123@jcpsnj.org",
      url: "https://docs.google.com/document/d/1m18fr7kzZElBLviR47IsSSuXQbcQas7kjkuwYhKlIt0/edit?tab=t.sapns71zh8up#heading=h.8bkyve5sdshv"
    },
    "Sharvesh": {
      email: "208419@jcpsnj.org",
      url: "https://docs.google.com/document/d/1CFQbdRgCQnWEJAUXBlqXA12n9CGZ2IZ4WnRdK-iejkU/edit?tab=t.sapns71zh8up#heading=h.8bkyve5sdshv"
    },
    "Arav": {
      email: "216871@jcpsnj.org",
      url: "https://docs.google.com/document/d/1URATum9mLUVK8PU7xdw13a7RUbQht5QBW7D5R5wDqnA/edit?tab=t.sapns71zh8up#heading=h.8bkyve5sdshv"
    },
    "Kevin": {
      email: "208337@jcpsnj.org",
      url: "https://docs.google.com/document/d/1BbIM-dT6gZO3ftDyJnTVVRidvtj_m9ExlUtqLHx3qiQ/edit?tab=t.sapns71zh8up#heading=h.8bkyve5sdshv"
    },
    "Param": {
      email: "207678@jcpsnj.org",
      url: "https://docs.google.com/document/d/1WWhc6CbH7YkYvxiBivSUZjHn8oVp-hGoAx2NC9x2AmM/edit?tab=t.sapns71zh8up#heading=h.8bkyve5sdshv"
    },
    "Tej": {
      email: "207134@jcpsnj.org",
      url: "https://docs.google.com/document/d/1ekcWM8urOuhDLc0ICtJALzSBiwFMKZR5Ul13tQvsMoc/edit?tab=t.sapns71zh8up#heading=h.8bkyve5sdshv"
    },
    "Ojas": {
      email: "226746@jcpsnj.org",
      url: "https://docs.google.com/document/d/1-QC7w13avURQyPkaYHebni1os71KSm2VFl7YaemD-Zw/edit?tab=t.sapns71zh8up#heading=h.8bkyve5sdshv"
    }
  };

  const $ = id => document.getElementById(id);

  function showScreen(screenId) {
    document.querySelectorAll(".screen").forEach(screen => {
      screen.classList.toggle("active", screen.id === screenId);
    });
  }

  function getSavedStudent() {
    try {
      const savedName = localStorage.getItem(STORAGE_KEY);
      return savedName && students[savedName] ? savedName : null;
    } catch {
      return null;
    }
  }

  function saveStudent(name) {
    try {
      localStorage.setItem(STORAGE_KEY, name);
      return true;
    } catch {
      return false;
    }
  }

  /*
    Open a blank tab immediately from the user's click.
    Then navigate that tab after the welcome message appears.
    This helps avoid popup blockers when embedded in Google Sites.
  */
  function openStudentDocument(name) {
    const student = students[name];
    if (!student) return;

    const destinationTab = window.open("about:blank", "_blank");

    showScreen("welcomeScreen");
    $("welcomeMessage").textContent = "Welcome " + name + "!";

    window.setTimeout(() => {
      if (destinationTab && !destinationTab.closed) {
        destinationTab.location.href = student.url;
      } else {
        // Fallback if the browser blocks opening a new tab.
        window.location.href = student.url;
      }
    }, 2000);
  }

  function buildNamePicker() {
    const list = $("nameList");
    list.innerHTML = "";

    Object.keys(students).forEach(name => {
      const button = document.createElement("button");
      button.className = "name-button";
      button.type = "button";
      button.textContent = name;

      button.addEventListener("click", () => {
        saveStudent(name);
        openStudentDocument(name);
      });

      list.appendChild(button);
    });
  }

  $("openButton").addEventListener("click", () => {
    const savedName = getSavedStudent();

    if (savedName) {
      openStudentDocument(savedName);
    } else {
      showScreen("pickerScreen");
    }
  });

  $("backButton").addEventListener("click", () => {
    showScreen("homeScreen");
  });

  buildNamePicker();
})();
</script>
</body>
</html>
